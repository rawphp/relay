# Structured formatting profile for LLM responses
# Toggle each provider independently (1 = enable Claude-style layout, 0 = original behavior)
format_enable_claude = 0
format_enable_openai_codex = 1
format_enable_gemini = 1

# Markdown heading token used for section titles (e.g., ##, ###)
format_heading_prefix = ##

# Minimum number of sections the model should produce (>=1)
format_min_sections = 2

# Maximum bullet points per section (enforced via instructions)
format_bullets_per_section = 6

# Global bullet cap to keep responses short
format_max_total_bullets = 12

# Bullet tone options: imperative | descriptive
format_bullet_voice = imperative

# Subheading style options: bold_numbered | bold_plain | plain
format_subheading_style = bold_numbered

# Allow freeform paragraphs outside bullet lists? (1=yes, 0=no)
format_allow_paragraphs = 0

# Allow markdown tables? (1=yes, 0=no)
format_allow_tables = 0

# Intro/outro handling: none | short_intro | closing_summary
format_intro_behavior = none
format_outro_behavior = none

# Future profiles can override these defaults per channel (unused today)
format_profile_default = claude_style
format_profile_alt = terse_updates
